<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adam's Recipe Box</title>
<meta name="description" content="Adam's tested recipes: chili, boils, slushies, mulled cider and more. Rate them and leave notes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='19' rx='3' fill='%231d3f73'/%3E%3Crect x='7' y='4' width='18' height='10' rx='2' fill='%23d9a514'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="app" id="app">
  <aside class="index">
    <div class="index-head">
      <div class="brand"><h1>Adam's Recipe Box</h1><span class="count" id="count"></span></div>
      <input class="search" id="q" type="search" placeholder="Search recipes, ingredients, tags" aria-label="Search recipes">
      <div class="row" id="cats" role="group" aria-label="Category"></div>
      <div class="traits-row" id="traits" role="group" aria-label="Good for"></div>
      <div class="row">
        <select class="select" id="show" aria-label="Show">
          <option value="all">All recipes</option>
          <option value="keepers">Adam's keepers</option>
          <option value="rated">Rated 4+</option>
          <option value="photos">With photos</option>
        </select>
        <select class="select" id="sort" aria-label="Sort">
          <option value="best">Best first</option>
          <option value="az">A to Z</option>
          <option value="new">Newest</option>
        </select>
      </div>
    </div>
    <div class="list" id="list"><div class="empty">Opening the box…</div></div>
  </aside>
  <main class="card-pane" id="pane">
    <div class="card" id="card"><div class="empty">Pick a recipe from the box.</div></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
